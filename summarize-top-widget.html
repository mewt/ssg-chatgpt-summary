<!-- ============================================================
     WIDGET 1 — Taruh di ATAS artikel (Varian 3: minimalis)
     Merangkum artikel lewat ChatGPT (membuka URL & membaca isinya).
     Tempel apa adanya ke hook / Custom HTML block. JANGAN pakai
     backslash: WordPress menghapus backslash di Custom HTML block
     dan merusak regex / escape apa pun. Semua logika bebas backslash.
     ============================================================ -->

<style id="ssg-summary-css">
.ssg-sum{display:flex;align-items:center;gap:16px;margin:22px 0;padding:18px 2px;
 border-top:1px solid #e5e7eb;border-bottom:1px solid #e5e7eb;
 font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.ssg-sum__spark{flex:none;color:#00a85a;line-height:0}
.ssg-sum__spark svg{width:26px;height:26px}
.ssg-sum__t{flex:1;min-width:0}
.ssg-sum__h{margin:0;color:#1f2937;font-size:16px;font-weight:700;line-height:1.3;text-transform:none}
.ssg-sum__s{margin:3px 0 0;color:#6b7280;font-size:13.5px;line-height:1.5}
.ssg-sum__btn{flex:none;color:#047a45;background:transparent;border:1.5px solid rgba(0,168,90,.55);
 border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer;
 transition:background .15s ease,border-color .15s ease}
.ssg-sum__btn:hover{background:#e9f9f0;border-color:#00a85a}
.ssg-sum__btn:focus-visible{outline:2px solid #047a45;outline-offset:2px}
@media(max-width:540px){.ssg-sum{flex-wrap:wrap}.ssg-sum__btn{width:100%;order:3;margin-top:4px}}
@media(prefers-reduced-motion:reduce){.ssg-sum__btn{transition:none}}
</style>

<div class="ssg-sum">
    <span class="ssg-sum__spark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9l-4.6 1.9L12 15.5 10.1 10.9 5.5 9l4.6-1.4L12 3z"/><path d="M19 14l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8.8-2z"/></svg></span>
    <div class="ssg-sum__t">
        <h3 class="ssg-sum__h" id="gpt-box-title">Too long to read?</h3>
        <p class="ssg-sum__s" id="gpt-box-sub">Let ChatGPT summarize this Smart Salary article for you in seconds.</p>
    </div>
    <button class="ssg-sum__btn" id="chatgpt-link-btn" type="button">✨ Summarize Now</button>
</div>

<script>
/* CATATAN: tanpa backslash sama sekali. WordPress menghapus backslash
   di Custom HTML block dan itu merusak regex apa pun di sini. */
function initGptBox() {
    var btn = document.getElementById('chatgpt-link-btn');
    if (!btn || btn.dataset.ready) return;
    btn.dataset.ready = '1';

    var currentLang = (document.documentElement.lang || 'en').toLowerCase();

    var texts = {
        en: {
            title: "Too long to read?",
            sub: "Let ChatGPT summarize this Smart Salary article for you in seconds.",
            btn: "✨ Summarize Now",
            prompt: 'Read this Smart Salary article and summarize it: "%TITLE%" %URL% Give me the key points and what an HR or payroll team should prepare.'
        },
        id: {
            title: "Terlalu panjang untuk dibaca?",
            sub: "Biar ChatGPT merangkum artikel Smart Salary ini untuk Anda dalam hitungan detik.",
            btn: "✨ Rangkum Sekarang",
            prompt: 'Tolong baca dan rangkum artikel Smart Salary ini: "%TITLE%" %URL% Jelaskan poin-poin pentingnya dan apa yang perlu disiapkan tim HR atau payroll.'
        },
        th: {
            title: "ยาวเกินไปที่จะอ่าน?",
            sub: "ให้ ChatGPT สรุปบทความ Smart Salary นี้ให้คุณภายในไม่กี่วินาที",
            btn: "✨ สรุปเลย",
            prompt: 'ช่วยอ่านและสรุปบทความ Smart Salary นี้: "%TITLE%" %URL% บอกประเด็นสำคัญและสิ่งที่ทีม HR หรือ Payroll ควรเตรียม'
        },
        zh: {
            title: "太长懒得看？",
            sub: "让 ChatGPT 在几秒内为您总结这篇 Smart Salary 文章。",
            btn: "✨ 立即总结",
            prompt: '请阅读并总结这篇 Smart Salary 文章：「%TITLE%」%URL% 说明关键要点，以及 HR 或薪酬团队应该准备什么。'
        }
    };

    var langKey = 'en';
    if (currentLang.indexOf('id') === 0) langKey = 'id';
    else if (currentLang.indexOf('th') === 0) langKey = 'th';
    else if (currentLang.indexOf('zh') === 0) langKey = 'zh';
    var t = texts[langKey];

    document.getElementById('gpt-box-title').innerText = t.title;
    document.getElementById('gpt-box-sub').innerText = t.sub;
    btn.innerText = t.btn;

    function squash(str) {
        var out = '', i, c;
        for (i = 0; i < str.length; i++) {
            c = str.charCodeAt(i);
            out += (c === 9 || c === 10 || c === 13) ? ' ' : str.charAt(i);
        }
        while (out.indexOf('  ') !== -1) { out = out.split('  ').join(' '); }
        return out.trim();
    }

    function stripSiteName(str) {
        var seps = [' | ', ' - ', ' ' + String.fromCharCode(8211) + ' ', ' ' + String.fromCharCode(8212) + ' '];
        var i, at, tail;
        for (i = 0; i < seps.length; i++) {
            at = str.lastIndexOf(seps[i]);
            if (at > 0) {
                tail = str.substring(at + seps[i].length);
                if (tail.toLowerCase().indexOf('smart salary') !== -1) {
                    return str.substring(0, at).trim();
                }
            }
        }
        return str.trim();
    }

    function metaContent(sel) {
        var el = document.querySelector(sel);
        return el ? (el.getAttribute('content') || '').trim() : '';
    }

    var h1 = document.querySelector('h1');
    var artTitle = metaContent('meta[property="og:title"]') || (h1 ? h1.innerText : '') || document.title;
    artTitle = stripSiteName(squash(artTitle));

    var canon = document.querySelector('link[rel="canonical"]');
    var artUrl = (canon ? canon.href : window.location.href).split('#')[0].split('?')[0];

    btn.addEventListener('click', function () {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
            event: 'ai_summarize_click',
            ai_engine: 'chatgpt',
            ai_placement: 'top_summarize',
            page_language: langKey,
            page_url: artUrl
        });
        var finalPrompt = squash(t.prompt
            .replace('%TITLE%', function () { return artTitle; })
            .replace('%URL%', function () { return artUrl; }));
        window.open("https://chatgpt.com/?hints=search&q=" + encodeURIComponent(finalPrompt), '_blank', 'noopener');
    });
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initGptBox);
} else {
    initGptBox();
}
</script>
